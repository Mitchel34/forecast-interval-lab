[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-interval-lab"
version = "0.1.0"
description = "A reproducible offline lab for past-only forecast intervals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forecast-interval-lab = "forecast_interval_lab.cli:main"

[tool.setuptools]
packages = ["forecast_interval_lab"]
